<!DOCTYPE html>
<html lang="en">
<head>
  <!-- charset + mobile layout -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- seo + discord embed -->
  <meta content="Source" property="og:title" />
  <meta content="s0urc3e" property="og:description" />
  <meta content="Source" property="og:url" />
  <meta content="s0urc3e" name="description" />
  <meta content="#533bd8" data-react-helmet="true" name="theme-color" />

  <!-- title + favicon -->
  <title>Source | welcome</title>
  <link rel="shortcut icon" type="image/png" href="assets/img/favicon.png" />

  <!-- assets -->
  <link rel="stylesheet" href="assets/css/style.css" />

  <script src="https://unpkg.com/typeit@8.0.1/dist/index.umd.js"></script>
  <script
    src="https://code.jquery.com/jquery-3.6.0.min.js"
    integrity="sha256-/xUj+3OJU5yExlq6GSYGSHk7tPXikynS7ogEvDej/m4="
    crossorigin="anonymous"
  ></script>
  <script src="assets/js/script.js" defer></script>
</head>

<body>
  <!-- Centered Intro Screen -->
  <div class="intro">
    <p id="intro-text"></p>
  </div>

  <!-- Background with Vignette Overlay -->
  <div class="bg-image" style="display: none"></div>
  <div class="bg-overlay" style="display: none"></div>

  <!-- Main Card Container -->
  <main class="main" style="display: none">
    <div class="box">
      <div class="header">
        <h1 class="maintext">Source</h1>
        <div class="subtext-wrapper">
          <span id="subtext" class="subtext"></span>
        </div>
      </div>

      <div class="divider"></div>

      <div class="footer">
        <button class="social-btn" onclick="openSocial('discord')" aria-label="Discord">
          <img src="assets/img/discord-512.png" alt="Discord" class="social-logo" />
        </button>
        <button class="social-btn" onclick="openSocial('github')" aria-label="GitHub">
          <img src="assets/img/github-512.png" alt="GitHub" class="social-logo" />
        </button>
        <button class="social-btn" onclick="openSocial('twitter')" aria-label="Twitter">
          <img src="assets/img/twitter-512.png" alt="Twitter" class="social-logo" />
        </button>
      </div>
    </div>
  </main>
</body>
</html>
